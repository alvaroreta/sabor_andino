{% extends 'base.html' %}

{% block title %}Liberación de Lotes - Sabor Andino{% endblock %}

{% block content %}
<div>
    {% include 'calidad/_nav.html' %}

    {% for message in messages %}
        <p><strong>{{ message }}</strong></p>
    {% endfor %}

    <h1>Control y Liberación de Lote</h1>

    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="acciones-formulario">
            <button type="submit" class="boton-ingresar">Registrar Liberación</button>
        </div>
    </form>
</div>
{% endblock %}
