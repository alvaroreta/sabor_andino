{% extends "base.html" %}

{% block title %} Nuevo Lote - Sabor Andino {% endblock %}

{% block content %}
    <h1>Crear Nuevo Lote</h1>

    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="acciones-formulario">
            <button type="submit" class="boton-ingresar">Crear Lote</button>
            <a href="{% url 'produccion:lista_lotes' %}" class="boton-secundario">Cancelar</a>
        </div>
    </form>
{% endblock %}
