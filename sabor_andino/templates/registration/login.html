{% extends "base.html" %}
{% load static %}


{% block content_class %}contenido-login{% endblock %}

{% block title %}Iniciar sesión - Sabor Andino{% endblock %}

{% block content %}
<div class="background">
    <div class="contenedor-login">
        <div class="contenedor-logo">
            <img src="{% static 'img/sabor_andino_logo.png' %}" alt="Sabor Andino" width="150" height="80">
        </div>

        <h1>Iniciar sesión</h1>
        <div class="cont-prin">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="boton-ingresar">Ingresar</button>
                <a href=""> ¿Olvidaste tu contraseña? </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
